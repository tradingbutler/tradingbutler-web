<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- The TradingButler mark: a price chart whose last point is its peak, the
       highest the line has ever reached. It is the Nadir mark turned upside
       down on purpose: same axes, gridlines and rhythm of moves, but climbing,
       because the butler's job is finding the best price rather than the
       lowest. Same treatment as the phirepass, ergo, Enclose and Nadir marks
       (neon sweep on a near-black body, bloom, lit edge), rotated into
       TradingButler's red-orange. The sweep stops at orange so it never
       reaches ergo's amber and yellow. -->
  <defs>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="8" y1="41" x2="40" y2="9">
      <stop offset="0%" stop-color="hsl(352 94% 58%)" />
      <stop offset="35%" stop-color="hsl(4 96% 58%)" />
      <stop offset="70%" stop-color="hsl(16 100% 58%)" />
      <stop offset="100%" stop-color="hsl(28 100% 64%)" />
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(358 36% 14%)" />
      <stop offset="50%" stop-color="hsl(8 38% 9%)" />
      <stop offset="100%" stop-color="hsl(18 42% 8%)" />
    </linearGradient>
    <radialGradient id="bloom" cx="62%" cy="30%" r="60%">
      <stop offset="0%" stop-color="hsl(10 98% 58%)" stop-opacity="0.40" />
      <stop offset="100%" stop-color="hsl(10 98% 58%)" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="hsl(352 94% 58%)" stop-opacity="0.8" />
      <stop offset="100%" stop-color="hsl(28 100% 64%)" stop-opacity="0.55" />
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(10 98% 60%)" stop-opacity="0.38" />
      <stop offset="100%" stop-color="hsl(10 98% 60%)" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#body)" />
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#bloom)" />
  <rect x="1" y="1" width="46" height="46" rx="12" fill="none" stroke="url(#edge)" stroke-width="1.8" />

  <!-- Gridlines. -->
  <path d="M10.5 18.5 L38.5 18.5 M10.5 28 L38.5 28" fill="none" stroke="url(#mark)"
        stroke-width="1" opacity="0.22" />
  <!-- Area under the line. -->
  <path d="M10.5 33 L15 27.5 L19 31 L23.5 22.5 L27.5 26 L31.5 18.5 L35.5 14.5 L35.5 37.5 L10.5 37.5 Z" fill="url(#area)" />
  <!-- Axes. -->
  <path d="M10.5 9.5 L10.5 37.5 L38.5 37.5" fill="none" stroke="url(#mark)"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  <!-- The price line. -->
  <path d="M10.5 33 L15 27.5 L19 31 L23.5 22.5 L27.5 26 L31.5 18.5 L35.5 14.5" fill="none" stroke="url(#mark)"
        stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Today, the peak: solid. -->
  <circle cx="35.5" cy="14.5" r="3.8" fill="url(#mark)" />
</svg>
